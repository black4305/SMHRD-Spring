spring.application.name=ThymeleafJPA

#port번호 등록 8087
server.port=8087
#ContextPath등록 (/jpa)
server.servlet.context-path=/jpa
#DB정보 등록
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/com
spring.datasource.username=com
spring.datasource.password=com01

# prefix, suffix(접두사, 접미사 ) -> View Resolver
# 기본적으로 설정된 prefix와 suffix를 사용
# prefix -> templates
# suffix -> .html

#JPA(Java Persistence API)
# ---> No SQL
# 개발자가 SQL구문을 작성할 필요 없이, 내부 구현체인 Hibernate도구를 사용하여
#  자동으로 class와 method를 기준으로 해서 SQL구문을 작성, 테이블 수정!

# 1. DB 문법 사용 설정(어떤 DB의 문법을 사용할지 지정)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 2. 테이블 생성을 언제 진행할건지
# create : 서버를 재 시작할 때마다, 테이블 생성
# update: 수정이 일어날때만, 테이블 생성
#spring.jpa.hibernate.ddl-auto= create
spring.jpa.hibernate.ddl-auto= update

# 3. 생성되는 SQL구문 볼건지(선택사항)
spring.jpa.show-sql=true

# 4. SQL 구문 가독성 좋게 출력(선택사항)
spring.jpa.properties.hibernate.format_sql=true














